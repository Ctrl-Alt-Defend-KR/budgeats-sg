[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (보안)
]
ignore = [
    "S101",  # assert 사용 — pytest에서 필요
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # 테스트의 더미 시크릿 문자열 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
