# 빌드·테스트·정적분석·의존성 취약점 스캔
#
# 근거: docs/development-plan.md 4.1절
# 시크릿 스캔은 별도 워크플로(security.yml)에서 먼저 돈다.
#
# 앱별로 잡을 나누고 paths-filter로 변경된 쪽만 실행한다.
# 모노레포에서 프론트만 고쳤는데 백엔드 잡까지 도는 것은 5일 일정에서 낭비다.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  changes:
    name: 변경 범위 판별
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint · typecheck · test · build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 의존성 취약점 스캔
        # moderate 이상이면 실패. 개발 전용 의존성의 저위험 경고까지 막으면
        # 5일 일정에서 대응 비용만 커진다.
        run: npm audit --audit-level=moderate

      - name: 린트
        # src/api 밖 fetch 사용, localStorage 사용을 여기서 잡는다 (CLAUDE.md 3.2절)
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

  backend:
    name: Backend (test · bootJar)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Gradle Wrapper 실행 권한 설정
        run: chmod +x gradlew

      - name: 테스트 및 실행 JAR 빌드
        run: ./gradlew test bootJar

  # 브랜치 보호 규칙에 필수 status check로 지정할 대상은 이 잡 하나다.
  #
  # 위 frontend/backend 잡은 paths-filter 때문에 조건부로 실행된다.
  # 프론트만 고친 PR에서는 backend 잡이 skipped 되는데, GitHub는 skipped된
  # 필수 체크를 "아직 보고되지 않음"으로 처리해 PR을 영구히 블록한다.
  # 그래서 항상 실행되는 이 잡이 선행 잡 결과를 대신 판정한다.
  ci-gate:
    name: CI 통과
    needs: [changes, frontend, backend]
    # 선행 잡이 실패하거나 skip돼도 이 잡은 반드시 실행되어야 결과를 보고할 수 있다.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 선행 잡 결과 판정
        # 아래 for 루프는 단어 분할에 의존한다. zsh 등에서는 동작이 달라지므로 셸을 고정한다.
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "선행 잡 결과: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              # skipped는 "해당 앱에 변경이 없었다"는 뜻이므로 통과로 본다.
              success | skipped) ;;
              *)
                echo "::error::선행 잡이 '${result}' 상태입니다."
                exit 1
                ;;
            esac
          done
          echo "모든 선행 잡 통과"
