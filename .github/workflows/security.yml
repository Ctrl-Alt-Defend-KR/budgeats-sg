# 시크릿 하드코딩 검출 파이프라인
#
# 근거: CLAUDE.md 3.2절 (시크릿 하드코딩 금지), docs/development-plan.md 4.1절
# 시크릿은 한 번 커밋되면 히스토리에서 지우기 어렵기 때문에,
# 다른 어떤 스캐너보다 먼저 동작해야 한다. 그래서 Day 1 최우선 항목이다.

name: Security

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: 시크릿 스캔 (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          # 커밋 히스토리 전체를 스캔하므로 shallow clone을 해제한다.
          # 이 값이 없으면 직전 커밋만 받아와 과거에 섞여 들어간 시크릿을 놓친다.
          fetch-depth: 0

      - name: gitleaks 설치
        env:
          GITLEAKS_VERSION: 8.30.1
        # 공식 gitleaks-action(v2)은 조직 소유 저장소에서 유료 라이선스 키를 요구한다.
        # 이 저장소는 조직(Ctrl-Alt-Defend-KR) 소유이므로 릴리스 바이너리를 직접 사용한다.
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 커밋 히스토리 스캔
        # --redact  : 검출된 값을 로그에 남기지 않는다. 이게 없으면 스캔 로그 자체가 유출 경로가 된다.
        # --verbose : 어떤 파일·라인·룰에서 걸렸는지 출력 (값은 위에서 마스킹됨)
        # 누출 검출 시 exit code 1 → 잡 실패 → PR 머지 차단
        run: gitleaks git . --redact --verbose --no-banner
